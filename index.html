<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>StreamVex Server</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
      <main class="main-content" style="text-align: center; padding: 20px;">
    <img src="https://i.ibb.co/yKpJcmG/04647954-3872-43ca-9bd3-37219efa9f11.png" alt="StreamVex Logo" style="width: 150px; display: block; margin: 0 auto 20px auto;">
    
    <h1 class="main-title" style="margin: 10px 0; font-size: 2.5em;">StreamVex</h1>
    <p class="subtitle" style="color: #888; margin-bottom: 30px;">الخادم المتكامل لأفضل ستريمرز المجتمع العربي في مكان واحد</p>
    
    <div id="content" class="grid" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 20px;"></div>
</main>
        
        <aside class="sidebar">
            <h2 class="sidebar-title">الـمنصات</h2>
            <button class="btn btn-kick" onclick="load('kick')"><img src="https://i.ibb.co/HpVBRxRQ/The-Kick-streaming-logo.jpg" class="icon"> KICK</button>
            <button class="btn" onclick="load('youtube')"><img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" class="icon"> YOUTUBE</button>
            <button class="btn" onclick="load('tiktok')"><img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png" class="icon"> TIKTOK</button>
            <button class="btn btn-discord" onclick="load('discord')"><img src="https://i.ibb.co/846X1mW6/991838-BD-F7-A6-479-D-8227-89-AFC89-DC022.jpg" class="icon"> DISCORD</button>
                        <button class="btn" onclick="load('twitch')"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111668.png" class="icon"> TWITCH</button>

            <div class="mission-box">
                <h3>StreamVex ⭐</h3>
                <p>انضم لسيرفرنا الرسمي!</p>
            </div>
        </aside>
    </div>
    <script src="script.js"></script>
</body>
</html>
